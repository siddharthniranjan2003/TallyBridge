appId: com.tallybridge.app
productName: TallyBridge
copyright: Copyright © 2026

directories:
  output: release

files:
  - dist/**/*
  - package.json

extraResources:
  - from: src/python/
    to: python/
  - from: assets/
    to: assets/
  - from: python-dist/tallybridge-engine.exe
    to: python-runtime/tallybridge-engine.exe

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # CODE SIGNING (required for production — see review finding pkg-01).
  # An UNSIGNED installer trips Windows Defender SmartScreen ("Unknown
  # publisher"), which blocks most non-technical users at first install and
  # leaves auto-updates unverifiable. To sign, provide an OV/EV Authenticode
  # certificate at BUILD time via either:
  #   1) Environment variables (no file change needed — electron-builder reads
  #      them automatically):
  #         CSC_LINK=path-or-base64-to-cert.pfx
  #         CSC_KEY_PASSWORD=the-cert-password
  #   2) Or uncomment and point these at the cert:
  # certificateFile: build/codesign.pfx
  # certificatePassword: ${env.CSC_KEY_PASSWORD}
  # Azure Trusted Signing is also supported via signtoolOptions.
  verifyUpdateCodeSignature: false  # set true once signing is in place

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: assets/icon.ico
  runAfterFinish: true

publish:
  provider: github
  owner: siddharthniranjan2003
  repo: TallyBridge