# TallyBridge local Supabase — trimmed self-hosted stack.
#
# Five services only: db, rest, meta, kong, studio.
# Deliberately NOT included (and why):
#   auth      — login is Firebase, handled in the backend
#   storage   — invoice images live in GCS
#   imgproxy  — only exists to serve storage
#   realtime  — nothing subscribes; Sale/Purchase push is paused for this client
#   functions — the ingest-sync edge function is not in the live read path
#   analytics — Logflare + vector, by far the heaviest part of the official file
#
# Everything is published on 127.0.0.1 only. The official compose file publishes on
# 0.0.0.0, which on a shop PC puts the client's whole ledger on every network
# interface. Do not remove the loopback prefixes.
#
# All secrets come from .env, which install.ps1 generates fresh per machine.

name: tallybridge-supabase

services:
  db:
    image: supabase/postgres:15.8.1.060
    container_name: tb_supabase_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54322}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      PGPORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - db-data:/var/lib/postgresql/data
      # MOUNT INDIVIDUAL FILES, NEVER THE DIRECTORY. /docker-entrypoint-initdb.d
      # in this image already holds migrate.sh and init-scripts/, which is what
      # creates the Supabase role set. Bind-mounting a directory over it hides all
      # of that, and the stack comes up with no `authenticator`, no `anon`, no
      # `postgres` — every PostgREST request then fails with
      # `password authentication failed for user "authenticator"`.
      #
      # The 99- prefix matters too: migrate.sh runs init-scripts/*.sql in glob
      # order, and the roles these files ALTER are created by 00000000000000-
      # initial-schema.sql. Sorting earlier means altering roles that do not exist
      # yet, and ON_ERROR_STOP=1 aborts the whole init.
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-tb-roles.sql:ro
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-tb-jwt.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf

  rest:
    image: postgrest/postgrest:v12.2.12
    container_name: tb_supabase_rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      # The MRP report fans out into ~150 chunked requests for one page load
      # (voucher_items keyed by 100 voucher ids at a time). PostgREST's default
      # pool of 10 is enough, but is stated here so it is a decision rather than
      # an accident if the report is ever widened.
      PGRST_DB_POOL: "10"
    command: postgrest
    # No healthcheck here on purpose: this image is distroless -- it has no shell
    # and no curl/wget -- so every CMD/CMD-SHELL probe fails to exec and would
    # report `unhealthy` on a container that is working perfectly. PostgREST is
    # covered instead by scripts/healthcheck.mjs, which calls it through Kong and
    # asserts on the rows that come back.

  meta:
    image: supabase/postgres-meta:v0.91.0
    container_name: tb_supabase_meta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  kong:
    image: kong:2.8.1
    container_name: tb_supabase_kong
    restart: unless-stopped
    depends_on:
      - rest
      - meta
    ports:
      - "127.0.0.1:${KONG_HTTP_PORT:-54321}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      # Generated by install.ps1 from volumes/api/kong.template.yml — it carries
      # the real anon/service keys, so it is gitignored.
      - ./volumes/api/kong.yml:/home/kong/kong.yml:ro

  studio:
    image: supabase/studio:2025.06.30-sha-6f5982d
    container_name: tb_supabase_studio
    restart: unless-stopped
    depends_on:
      - meta
      - kong
    ports:
      - "127.0.0.1:${STUDIO_PORT:-54323}:3000"
    environment:
      # Docker sets HOSTNAME to the container id, and Studio's Next.js standalone
      # server binds to whatever HOSTNAME says. It then listens only on the
      # container's eth0 address, so its own healthcheck -- which fetches
      # http://localhost:3000/api/platform/profile from inside -- gets
      # ECONNREFUSED and the container reports `unhealthy` forever. Studio still
      # works through the published port, which makes this look like a mystery.
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-TallyBridge}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-TallyBridge Local}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://127.0.0.1:54321}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ""
      LOGFLARE_URL: ""
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres

volumes:
  db-data:
    name: tallybridge_supabase_db_data
